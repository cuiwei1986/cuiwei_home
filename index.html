<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人页</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FB090B'/%3E%3Ctext x='32' y='46' font-size='40' font-family='sans-serif' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3E%E5%B4%94%3C/text%3E%3C/svg%3E">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212; 
            color: #E0E0E0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ---------- 顶部：日期 + 天气 ---------- */
        :root {
            --panel: #1A1A1A;
            --line: rgba(255, 255, 255, 0.08);
            --text: #E8EAED;
            --muted: #9AA0A6;
            --accent: #FB090B;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            width: 100%;
            box-sizing: border-box;
            padding: 14px clamp(16px, 4vw, 40px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, rgba(26, 26, 26, 0.94), rgba(18, 18, 18, 0.72));
            border-bottom: 1px solid var(--line);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
        }

        /* 左上角个人标识 */
        .brand {
            position: absolute;
            top: 50%;
            left: clamp(16px, 4vw, 40px);
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .brand-mark {
            position: relative;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            font-size: 19px;
            font-weight: 800;
            line-height: 1;
            color: #FFFFFF;
            background: linear-gradient(145deg, #FF4D4F 0%, #FB090B 45%, #C2070A 100%);
            box-shadow: 0 8px 20px rgba(251, 9, 11, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.45),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.18);
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent 60%);
            pointer-events: none;
        }

        .brand:hover .brand-mark {
            transform: translateY(-1px) scale(1.05);
            box-shadow: 0 12px 26px rgba(251, 9, 11, 0.42),
                        inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .brand-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text);
        }

        /* 顶部信息胶囊：日期、天气各自独立 */
        .header-pills {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            box-sizing: border-box;
            min-height: 58px; /* 与日期模块等高，保证三个胶囊大小一致 */
            padding: 10px 22px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid var(--line);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            cursor: pointer;
            user-select: none;
            transition: transform 0.25s ease, border-color 0.25s ease,
                        background 0.25s ease, box-shadow 0.25s ease;
        }

        .header-pill:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(251, 9, 11, 0.35);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .header-pill:focus-visible {
            outline: 2px solid rgba(251, 9, 11, 0.6);
            outline-offset: 3px;
        }

        .header-pill .date {
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .header-pill .calc-icon {
            flex: none;
            width: 30px;
            height: 30px;
            color: var(--text);
            transition: color 0.25s ease;
        }

        .header-pill:hover .calc-icon {
            color: var(--accent);
        }

        .header-pill .calc-name {
            font-size: 13px;
            line-height: 1;
            letter-spacing: 0.5px;
            color: var(--muted);
            white-space: nowrap;
            transition: color 0.25s ease;
        }

        .header-pill:hover .calc-name {
            color: var(--text);
        }

        .date .day {
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -1px;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .date .date-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            line-height: 1;
        }

        .date .ym {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--muted);
        }

        .date .week {
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 999px;
            color: #FCA5A5;
            background: rgba(251, 9, 11, 0.12);
            border: 1px solid rgba(251, 9, 11, 0.22);
        }

        .weather {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .weather .weather-icon {
            font-size: 26px;
            line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
        }

        .weather .weather-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            line-height: 1.1;
        }

        .weather .temp {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .weather .temp .unit {
            margin-left: 1px;
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
        }

        .weather .desc {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .weather .temp .city {
            margin-right: 5px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }

        .weather .desc .min { color: #93C5FD; }
        .weather .desc .max { color: #FBBF24; }

        .weather.loading .weather-icon {
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50%      { opacity: 1; }
        }

        /* ---------- 搜索框 ---------- */
        /* 搜索区外层（用于定位历史面板） */
        .search-wrap {
            position: relative;
            width: min(760px, calc(100% - 32px));
            margin-top: 32px;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015)), #171717;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .search-box:hover {
            border-color: rgba(255, 255, 255, 0.16);
        }

        .search-box:focus-within {
            border-color: rgba(251, 9, 11, 0.55);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5),
                        0 0 0 4px rgba(251, 9, 11, 0.12);
        }

        /* 搜索引擎下拉（带品牌图标） */
        .engine {
            position: relative;
            flex: none;
        }

        .engine-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 8px 14px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.4;
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .engine-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.16);
        }

        .engine-btn[aria-expanded="true"] {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(251, 9, 11, 0.45);
        }

        .engine-btn:focus-visible {
            outline: none;
            border-color: rgba(251, 9, 11, 0.5);
            box-shadow: 0 0 0 3px rgba(251, 9, 11, 0.15);
        }

        .engine-logo {
            display: grid;
            place-items: center;
            flex: none;
            width: 18px;
            height: 18px;
        }

        .engine-logo img,
        .engine-logo .brand-svg {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            object-fit: contain;
        }

        .engine-logo .brand-svg {
            display: block;
        }

        .engine-btn .logo-slot {
            display: none;
            place-items: center;
            width: 18px;
            height: 18px;
        }

        .engine[data-engine="bing"] .engine-btn .logo-slot[data-brand="bing"],
        .engine[data-engine="google"] .engine-btn .logo-slot[data-brand="google"],
        .engine[data-engine="baidu"] .engine-btn .logo-slot[data-brand="baidu"] {
            display: grid;
        }

        .engine .logo-fallback {
            display: grid;
            place-items: center;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .engine-caret {
            margin-left: 1px;
            color: var(--muted);
            transition: transform 0.2s ease;
        }

        .engine-btn[aria-expanded="true"] .engine-caret {
            transform: rotate(180deg);
        }

        .engine-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            z-index: 30;
            min-width: 180px;
            margin: 0;
            padding: 6px;
            list-style: none;
            background: #1C1C1E;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            transform-origin: top left;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .engine-menu.open {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .engine-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 10px;
            font-size: 14px;
            color: #D5D8DD;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .engine-item:hover,
        .engine-item:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
        }

        .engine-item[aria-selected="true"] {
            color: #FFFFFF;
        }

        .engine-item .check {
            margin-left: auto;
            color: #FB090B;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .engine-item[aria-selected="true"] .check {
            opacity: 1;
        }

        .search-box input[type="text"] {
            flex: 1 1 auto;
            min-width: 0;
            width: auto;
            padding: 10px 8px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: transparent;
            border: none;
            outline: none;
            letter-spacing: 0.2px;
        }

        .search-box input[type="text"]::placeholder {
            color: #6B7076;
        }

        .search-box .search-btn {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            color: #FFFFFF;
            background: linear-gradient(135deg, #FF4D4F, #FB090B 55%, #C2070A);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(251, 9, 11, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .search-box .search-btn svg {
            flex: none;
        }

        .search-box .search-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.07);
            box-shadow: 0 10px 22px rgba(251, 9, 11, 0.38);
        }

        .search-box .search-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .search-box .search-btn:focus-visible {
            outline: 2px solid rgba(251, 9, 11, 0.7);
            outline-offset: 3px;
        }

        /* ---------- 搜索历史 ---------- */
        .history-panel {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            z-index: 30;
            padding: 6px;
            background: #1C1C1E;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        }

        .history-panel[hidden] {
            display: none;
        }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px 6px;
        }

        .history-title {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--muted);
        }

        .history-clear {
            padding: 3px 8px;
            font-family: inherit;
            font-size: 12px;
            color: var(--muted);
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .history-clear:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.08);
        }

        .history-list {
            margin: 0;
            padding: 0;
            max-height: 304px;
            overflow-y: auto;
            list-style: none;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .history-item .h-text {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 14px;
            text-align: left;
            color: #D5D8DD;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover .h-text {
            color: #FFFFFF;
        }

        .history-item .h-time {
            flex: none;
            font-size: 11px;
            color: #6B7076;
            font-variant-numeric: tabular-nums;
        }

        .history-item .h-del {
            flex: none;
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            padding: 0;
            color: var(--muted);
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .history-item .h-del:hover {
            color: #F87171;
            background: rgba(248, 113, 113, 0.14);
        }

        .history-item .h-del svg {
            display: block;
        }

        /* ---------- AC米兰赛程 ---------- */
        .milan-card {
            width: min(880px, calc(100% - 32px));
            box-sizing: border-box;
            margin: 28px auto 56px;
            text-align: left;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)), #171717;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
            overflow: hidden;
        }

        .milan-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
        }

        .milan-crest {
            flex: none;
            width: 30px;
            height: 30px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
        }

        /* 队徽加载失败时的红底占位 */
        .crest-fallback {
            display: inline-grid;
            place-items: center;
            flex: none;
            border-radius: 5px;
            background: linear-gradient(145deg, #FF4D4F, #C2070A);
            color: #FFFFFF;
            font-weight: 700;
            line-height: 1;
            user-select: none;
        }

        .crest-fallback.mini {
            width: 16px;
            height: 16px;
            font-size: 9px;
        }

        .crest-fallback.full {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-size: 14px;
        }

        .crest-fallback.gray {
            background: rgba(255, 255, 255, 0.12);
            color: #C9CDD3;
        }

        .milan-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text);
        }

        /* 咪咕意甲跳转 */
        .milan-migu {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .milan-migu img {
            display: block;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            object-fit: contain;
        }

        .milan-migu .migu-fallback {
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
        }

        .milan-migu:hover {
            color: var(--text);
            border-color: rgba(251, 9, 11, 0.45);
            background: rgba(251, 9, 11, 0.1);
        }

        .milan-migu:focus-visible {
            outline: 2px solid rgba(251, 9, 11, 0.6);
            outline-offset: 2px;
        }

        .milan-list {
            display: flex;
            flex-direction: column;
            max-height: 300px; /* 默认 4 场 + 上下加载提示恰好容纳 */
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
        }

        .milan-list::-webkit-scrollbar {
            width: 6px;
        }

        .milan-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border-radius: 3px;
        }

        .milan-list::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 顶部/底部加载提示行（可点击） */
        .milan-sentinel {
            padding: 8px 18px;
            font-size: 11px;
            color: #6B7076;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
        }

        .milan-sentinel:hover {
            color: var(--text);
        }

        .milan-loading {
            padding: 20px 18px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        .milan-empty {
            padding: 22px 18px;
            font-size: 12px;
            color: #6B7076;
            text-align: center;
        }

        .milan-match {
            display: grid;
            grid-template-columns: 74px 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--line);
        }

        .milan-match:last-child {
            border-bottom: none;
        }

        .m-date {
            display: flex;
            flex-direction: column;
            gap: 3px;
            line-height: 1.1;
        }

        .m-date .d {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .m-date .t {
            font-size: 11px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .m-main {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .m-comp {
            font-size: 11px;
            letter-spacing: 0.3px;
            color: var(--muted);
        }

        .m-teams {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #C9CDD3;
            white-space: nowrap;
        }

        .m-teams .team {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .m-teams .team.is-milan {
            font-weight: 700;
            color: #FFFFFF;
        }

        .m-teams .crest-mini {
            flex: none;
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .m-teams .vs {
            flex: none;
            font-size: 12px;
            color: #6B7076;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        .m-teams .vs.is-score {
            font-size: 14px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .m-side {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .m-result {
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
        }

        .m-result.win {
            color: #4ADE80;
            background: rgba(74, 222, 128, 0.12);
        }

        .m-result.draw {
            color: #FBBF24;

                font-size: 13px;
                white-space: normal;
            }

                padding: 13px 14px;

        /* ---------- 快捷方式 ---------- */
        .favorites {
            width: min(880px, calc(100% - 32px));
            margin: 28px auto 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 12px;
        }

        @media (min-width: 900px) {
            .favorites {
                grid-template-columns: repeat(8, minmax(0, 1fr));
            }
        }

        .favorite {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 8px 13px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)), #171717;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            color: var(--text);
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
            transition: transform 0.25s ease, border-color 0.25s ease,
                        box-shadow 0.25s ease, background 0.25s ease;
        }

        .favorite::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .favorite:hover {
            transform: translateY(-4px);
            border-color: rgba(251, 9, 11, 0.35);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.5),
                        inset 0 0 0 1px rgba(251, 9, 11, 0.08);
        }

        .favorite:hover::before {
            opacity: 1;
        }

        .favorite:active {
            transform: translateY(-1px) scale(0.98);
        }

        .favorite:focus-visible {
            outline: 2px solid rgba(251, 9, 11, 0.6);
            outline-offset: 3px;
        }

        .favorite .favicon {
            display: grid;

            width: 44px;
            height: 44px;
            border-radius: 13px;

            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;

        .favorite:hover .favicon {
            transform: scale(1.07);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .favorite .favicon img {
            display: block;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: contain;

            white-space: nowrap;

            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);

            if (d.toDateString() === now.toDateString()) return `今天 ${hm}`;
            if (d.toDateString() === yesterday.toDateString()) return `昨天 ${hm}`;
            return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
        }

        // ---------- AC米兰赛程（实时获取：ESPN 公开接口，支持跨域；滚动加载更多场次） ----------

        let pastFixtures = [];    // 已结束（新→旧）

        function fetchJson(url, retries = 1) {
            return fetch(url).then(res => {

        // ESPN 时间为 UTC，转换为北京时间
        function toBeijing(iso) {
            if (!iso) return { d: '--/--', t: '--:--' };
            const utcStr = /Z|[+-]\d{2}:?\d{2}$/.test(iso) ? iso : iso + 'Z';
            const utc = new Date(utcStr);
            if (Number.isNaN(utc.getTime())) return { d: '--/--', t: '--:--' };
            const fmtDate = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric' });
            const fmtTime = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false });
            return { d: fmtDate.format(utc), t: fmtTime.format(utc) };
        }

        function ymd(date) {
            const p = n => String(n).padStart(2, '0');
            return `${date.getFullYear()}${p(date.getMonth() + 1)}${p(date.getDate())}`;
        }

        // ESPN 赛事对象 → 赛程结构
        function mapEspnEvent(e, leagueLabel) {
            const comp = (e.competitions || [])[0];
            const competitors = (comp && comp.competitors) || [];
            const home = competitors.find(c => c.homeAway === 'home');
            const away = competitors.find(c => c.homeAway === 'away');
            if (!home || !away) return null;

            const completed = !!(comp.status && comp.status.type && comp.status.type.completed);
            const hs = home.score ? home.score.displayValue : null;
            const as = away.score ? away.score.displayValue : null;
            const score = (completed && hs != null && as != null) ? [Number(hs), Number(as)] : null;

            const homeName = home.team.displayName;
            const awayName = away.team.displayName;
            const opponent = homeName === 'AC Milan' ? awayName : homeName;
            let compLabel = leagueLabel;

            // 队徽：优先用接口返回的 logos，其次按球队 ID 拼接 ESPN 图床
            const crestOf = team => (team.logos && team.logos[0] && team.logos[0].href)
                || (team.id ? `https://a.espncdn.com/i/teamlogos/soccer/500/${team.id}.png` : '');

            // ESPN 比赛详情页：取接口返回的链接，缺失时按赛事 ID 拼接
            const links = e.links || [];
            const summaryLink = links.find(l => l.rel && l.rel.includes('summary') && /espn\.com\/soccer\/match/.test(l.href))
                || links.find(l => l.rel && l.rel.includes('summary') && /espn\.com/.test(l.href));
            const matchUrl = (summaryLink && summaryLink.href)
                || (e.id ? `https://www.espn.com/soccer/match/_/gameId/${e.id}` : '');

            const { d, t } = toBeijing(e.date);
            return {
                ts: Date.parse(/Z|[+-]\d{2}:?\d{2}$/.test(e.date) ? e.date : e.date + 'Z'),
                date: d,
                time: t,
                comp: compLabel,
                home: TEAM_ZH[homeName] || homeName,
                away: TEAM_ZH[awayName] || awayName,
                homeCrest: crestOf(home.team),
                awayCrest: crestOf(away.team),
                matchUrl,
                score
            };
        }

        // 米兰视角的赛果：win / draw / loss / null（未开赛）
        function milanResult(fixture) {
            if (!fixture.score) return null;
            const isHome = fixture.home === MILAN;
            const goalsFor = isHome ? fixture.score[0] : fixture.score[1];
            const goalsAgainst = isHome ? fixture.score[1] : fixture.score[0];
            if (goalsFor > goalsAgainst) return 'win';
            if (goalsFor === goalsAgainst) return 'draw';
            return 'loss';
        }

        function createMatchRow(fixture) {
            const result = milanResult(fixture);
            const scoreText = fixture.score ? `${fixture.score[0]} - ${fixture.score[1]}` : 'VS';

            const row = document.createElement('div');
            row.className = 'milan-match';

            const date = document.createElement('div');
            date.className = 'm-date';
            date.innerHTML = `<span class="d">${fixture.date}</span><span class="t">${fixture.time}</span>`;

            const main = document.createElement('div');
            main.className = 'm-main';
            const crestImg = (url, name, isMilanTeam) => url
                ? `<img class="crest-mini" src="${url}" alt="" referrerpolicy="no-referrer" data-team="${isMilanTeam ? 'milan' : 'opponent'}" data-initial="${name}">`
                : '';
            const homeCrest = crestImg(fixture.homeCrest, fixture.home, fixture.home === MILAN);
            const awayCrest = crestImg(fixture.awayCrest, fixture.away, fixture.away === MILAN);
            main.innerHTML = `

        function updateSentinels() {

        // 上滑：从已获取的历史数据中追加更早场次
        function loadMorePast() {

            if (pastRendered >= pastFixtures.length) {

            loadingPast = true;

            const prevHeight = milanList.scrollHeight;

        // 获取各联赛本赛季比赛日（用于按日期抓取未来赛程）
        async function loadCalendars() {
            if (calendarsLoaded) return;
            const today = ymd(new Date());
            const responses = await Promise.all(ESPN_LEAGUES.map(l =>
                fetchJson(`${ESPN_BASE}/${l.code}/scoreboard?dates=${today}`).catch(() => null)
            ));
            const queue = [];
            responses.forEach((r, i) => {
                const calendar = r && r.leagues && r.leagues[0] && r.leagues[0].calendar;
                if (!calendar) return;
                calendar.forEach(d => {
                    const key = ymd(new Date(d));
                    // 含今天：当晚/北京时间次日的比赛（UTC 日期为今天）也能被扫到
                    if (key >= today) queue.push({ date: key, code: ESPN_LEAGUES[i].code, label: ESPN_LEAGUES[i].label });
                });
            });
            queue.sort((a, b) => (a.date < b.date ? -1 : 1));
            futureDateQueue = queue;
            calendarsLoaded = true;
        }

        // 下滑：按比赛日抓取未来场次并追加，maxNew 限制本次最多渲染几行，返回实际新增行数
        async function loadMoreFuture(maxNew = Infinity) {
            if (loadingFuture || futureExhausted || !milanList.contains(bottomSentinel)) return 0;
            loadingFuture = true;
            updateSentinels();
            let added = 0;
            try {
                await loadCalendars();
                let found = 0;
                // 逐批抓取未来比赛日，直到找到米兰的比赛或队列耗尽
                while (found === 0 && futureDateQueue.length > 0) {
                    const batch = futureDateQueue.splice(0, 5);
                    const results = await Promise.all(batch.map(b =>
                        fetchJson(`${ESPN_BASE}/${b.code}/scoreboard?dates=${b.date}`)
                            .then(r => (r.events || []).map(e => mapEspnEvent(e, b.label)))
                            .catch(() => [])
                    ));
                    results.forEach(list => {
                        (list || []).forEach(f => {
                            if (!f || f.score) return;                                // 只收未开赛
                            if (f.home !== MILAN && f.away !== MILAN) return;         // 只收米兰的比赛
                            if (futureFixtures.some(x => x.ts === f.ts)) return;      // 去重
                            futureFixtures.push(f);
                            found++;
                        });
                    });
                }
                if (found === 0 && futureDateQueue.length === 0) futureExhausted = true;
                futureFixtures.sort((a, b) => a.ts - b.ts);

                futureFixtures.slice(futureRendered).slice(0, maxNew).forEach(fixture => {
                    milanList.insertBefore(createMatchRow(fixture), bottomSentinel);
                    futureRendered++;
                    added++;
                });
            } catch (err) {
                console.warn('AC米兰未来赛程加载失败：', err);
            }
            loadingFuture = false;
            bindCrestFallback();
            updateSentinels();
            return added;
        }

        async function initMilanFixtures() {
            milanList.innerHTML = '<div class="milan-loading">赛程加载中…</div>';
            try {
                // 并行拉取各联赛的球队信息（含 nextEvent、队徽）与历史赛程
                const requests = [];
                ESPN_LEAGUES.forEach(l => {
                    requests.push(fetchJson(`${ESPN_BASE}/${l.code}/teams/${ESPN_MILAN_ID}`).catch(() => null));
                    requests.push(fetchJson(`${ESPN_BASE}/${l.code}/teams/${ESPN_MILAN_ID}/schedule`).catch(() => null));
                });
                const responses = await Promise.all(requests);
                const nextCandidates = [];

                ESPN_LEAGUES.forEach((l, i) => {
                    const team = responses[i * 2];
                    const schedule = responses[i * 2 + 1];

                    if (team && team.team) {
                        const logos = team.team.logos || [];
                        if (logos.length && logos[0].href) milanCrest = logos[0].href;
                        const next = team.team.nextEvent && team.team.nextEvent[0];
                        if (next) {
                            const f = mapEspnEvent(next, l.label);
                            if (f && !f.score) nextCandidates.push(f);
                        }
                    }
                    if (schedule && Array.isArray(schedule.events)) {
                        schedule.events.forEach(e => {
                            const f = mapEspnEvent(e, l.label);
                            if (f && f.score) pastFixtures.push(f);
                        });
                    }
                });

                pastFixtures.sort((a, b) => b.ts - a.ts);
                nextCandidates.sort((a, b) => a.ts - b.ts);

                // nextEvent 缺失（接口抖动）时，用今明两天赛程兜底找下一场
                if (!nextCandidates.length) {
                    const base = new Date();
                    const days = [ymd(base), ymd(new Date(base.getTime() + 86400000))];
                    const todays = await Promise.all(days.flatMap(day =>
                        ESPN_LEAGUES.map(l => fetchJson(`${ESPN_BASE}/${l.code}/scoreboard?dates=${day}`).catch(() => null))
                    ));
                    todays.forEach((r, idx) => {
                        const label = ESPN_LEAGUES[idx % ESPN_LEAGUES.length].label;
                        (r && r.events ? r.events : []).forEach(e => {
                            const f = mapEspnEvent(e, label);
                            if (f && !f.score && (f.home === MILAN || f.away === MILAN)) nextCandidates.push(f);
                        });
                    });
                    nextCandidates.sort((a, b) => a.ts - b.ts);
                }

                if (nextCandidates.length) futureFixtures.push(nextCandidates[0]);

                milanLive = pastFixtures.length > 0 || futureFixtures.length > 0;
            } catch (err) {
                // 实时获取失败：不展示任何数据，保持为空
                console.warn('AC米兰赛程实时获取失败：', err);
                pastFixtures = [];
                futureFixtures = [];
                milanLive = false;
            }

            const headerCrest = document.querySelector('.milan-crest');
            if (headerCrest && milanCrest && headerCrest.src !== milanCrest) headerCrest.src = milanCrest;
            renderInitial();

            // 预拉取未来场次，保证默认展示 1 场未开赛（每次最多补 1 行）
            let guard = 0;
            while (futureRendered < FUTURE_INIT && !futureExhausted && guard < 5) {
                const added = await loadMoreFuture(FUTURE_INIT - futureRendered);
                if (!added) break;
                guard++;
            }
            updateSentinels();
        }

        // 队徽加载失败时占位：米兰用红底“米”，对手用灰底队名首字
        function crestFallback(img) {
            const mini = img.classList.contains('crest-mini');
            const fallback = document.createElement('span');
            if (img.dataset.team === 'opponent') {
                fallback.className = 'crest-fallback mini gray';
                fallback.textContent = (img.dataset.initial || '?').charAt(0);
            } else {
                fallback.className = 'crest-fallback ' + (mini ? 'mini' : 'full');
                fallback.textContent = '米';
            }
            fallback.setAttribute('aria-hidden', 'true');
            img.replaceWith(fallback);
        }

        function bindCrestFallback() {
            document.querySelectorAll('.milan-crest, .crest-mini').forEach(img => {
                if (img.dataset.crestBound) return;
                img.dataset.crestBound = '1';
                img.addEventListener('error', () => crestFallback(img));
                if (img.complete && img.naturalWidth === 0) crestFallback(img);
            });
        }

        // 咪咕图标加载失败时用“咪”字占位
        function bindMiguFallback() {
            const icon = document.querySelector('.milan-migu img');
            if (!icon || icon.dataset.bound) return;
            icon.dataset.bound = '1';
            const showFallback = () => {
                const fallback = document.createElement('span');
                fallback.className = 'migu-fallback';
                fallback.textContent = '咪';
                icon.replaceWith(fallback);
            };
            icon.addEventListener('error', showFallback);
            if (icon.complete && icon.naturalWidth === 0) showFallback();
        }
        bindMiguFallback();

        // 页面加载时拉取实时赛程数据
        initMilanFixtures();

        // 搜索引擎下拉（图标 + 键盘操作）
        const engineBox = document.getElementById('engine');
        const engineBtn = document.getElementById('engine-btn');
        const engineMenu = document.getElementById('engine-menu');
        const engineName = document.getElementById('engine-name');
        const engineInput = document.getElementById('search-engine');
        const engineItems = Array.from(engineMenu.querySelectorAll('.engine-item'));

        function setEngineMenu(open) {
            engineMenu.classList.toggle('open', open);
            engineMenu.setAttribute('aria-hidden', open ? 'false' : 'true');
            engineBtn.setAttribute('aria-expanded', open ? 'true' : 'false');

            if (open) {
                const current = engineItems.find(item => item.getAttribute('aria-selected') === 'true') || engineItems[0];
                current.focus();
            }
        }

        function selectEngine(item) {
            engineBox.dataset.engine = item.dataset.brand;
            engineName.textContent = item.dataset.name;
            engineInput.value = item.dataset.value;
            engineBtn.setAttribute('aria-label', '搜索引擎：' + item.dataset.name);

            engineItems.forEach(el => el.setAttribute('aria-selected', el === item ? 'true' : 'false'));

            setEngineMenu(false);
            engineBtn.focus();
        }

        engineBtn.addEventListener('click', () => {
            setEngineMenu(engineBtn.getAttribute('aria-expanded') !== 'true');
        });

        engineBtn.addEventListener('keydown', event => {
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                event.preventDefault();
                setEngineMenu(true);
            } else if (event.key === 'Escape') {
                setEngineMenu(false);
            }
        });

        engineItems.forEach((item, index) => {
            item.addEventListener('click', () => selectEngine(item));

            item.addEventListener('keydown', event => {
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    event.preventDefault();
                    const step = event.key === 'ArrowDown' ? 1 : -1;
                    engineItems[(index + step + engineItems.length) % engineItems.length].focus();
                } else if (event.key === 'Home') {
                    event.preventDefault();
                    engineItems[0].focus();
                } else if (event.key === 'End') {
                    event.preventDefault();
                    engineItems[engineItems.length - 1].focus();
                } else if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    selectEngine(item);
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    setEngineMenu(false);
                    engineBtn.focus();
                } else if (event.key === 'Tab') {
                    setEngineMenu(false);
                }
            });
        });

        // 点击空白处关闭下拉与历史面板
        document.addEventListener('click', event => {
            if (!engineBox.contains(event.target)) setEngineMenu(false);
            if (!searchWrap.contains(event.target)) hideHistory();
        });

        // 搜索引擎图标加载失败时用品牌首字占位
        document.querySelectorAll('.engine-logo img').forEach(img => {
            img.addEventListener('error', () => {
                const box = img.parentElement;
                if (!box || box.dataset.fallback) return;
                box.dataset.fallback = '1';

                const fallback = document.createElement('span');
                fallback.className = 'logo-fallback';
                fallback.textContent = (img.alt || '?').charAt(0);
                fallback.style.background = img.dataset.color || '#3A3A3C';
                img.replaceWith(fallback);
            });
        });

        // 图标加载失败时用名称首字占位，避免出现空白方块
        document.querySelectorAll('.favorite .favicon img').forEach(img => {
            const showFallback = () => {
                if (img.dataset.done) return;
                img.dataset.done = '1';

                const box = img.parentElement;
                const nameEl = img.closest('.favorite').querySelector('.name');
                img.remove();

                const fallback = document.createElement('span');
                fallback.className = 'fallback';
                fallback.textContent = nameEl ? nameEl.textContent.trim().charAt(0) : '?';
                box.appendChild(fallback);
            };

            img.addEventListener('error', showFallback);
            if (img.complete && img.naturalWidth === 0) showFallback();
        });
    </script>
</body>
</html>
