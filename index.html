    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212; 
            color: #E0E0E0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ---------- 顶部：日期 + 天气 ---------- */
        :root {
            --panel: #1A1A1A;
            --line: rgba(255, 255, 255, 0.08);
            --text: #E8EAED;
            --muted: #9AA0A6;
            --accent: #4ADE80;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            width: 100%;
            box-sizing: border-box;
            padding: 14px clamp(16px, 4vw, 40px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, rgba(26, 26, 26, 0.94), rgba(18, 18, 18, 0.72));
            border-bottom: 1px solid var(--line);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
        }

        /* 左上角个人标识 */
        .brand {
            position: absolute;
            top: 50%;
            left: clamp(16px, 4vw, 40px);
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .brand-mark {
            position: relative;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            font-size: 19px;
            font-weight: 800;
            line-height: 1;
            color: #06281B;
            background: linear-gradient(145deg, #4ADE80 0%, #22C55E 45%, #16A34A 100%);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.45),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.18);
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent 60%);
            pointer-events: none;
        }

        .brand:hover .brand-mark {
            transform: translateY(-1px) scale(1.05);
            box-shadow: 0 12px 26px rgba(34, 197, 94, 0.42),
                        inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .brand-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text);
        }

        /* 顶部信息胶囊：日期、天气各自独立 */
        .header-pills {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid var(--line);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            cursor: pointer;
            user-select: none;
            transition: transform 0.25s ease, border-color 0.25s ease,
                        background 0.25s ease, box-shadow 0.25s ease;
        }

        .header-pill:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(74, 222, 128, 0.35);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .header-pill:focus-visible {
            outline: 2px solid rgba(74, 222, 128, 0.6);
            outline-offset: 3px;
        }

        .header-pill .date {
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .date .day {
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -1px;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .date .date-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            line-height: 1;
        }

        .date .ym {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--muted);
        }

        .date .week {
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 999px;
            color: #86EFAC;
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.22);
        }

        .weather {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .weather .weather-icon {
            font-size: 26px;
            line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
        }

        .weather .weather-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            line-height: 1.1;
        }

        .weather .temp {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .weather .temp .unit {
            margin-left: 1px;
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
        }

        .weather .desc {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .weather .desc .min { color: #93C5FD; }
        .weather .desc .max { color: #FBBF24; }

        .weather.loading .weather-icon {
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50%      { opacity: 1; }
        }

        /* ---------- 搜索框 ---------- */
        /* 搜索区外层（用于定位历史面板） */
        .search-wrap {
            position: relative;
            width: min(760px, calc(100% - 32px));
            margin-top: 32px;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015)), #171717;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .search-box:hover {
            border-color: rgba(255, 255, 255, 0.16);
        }

        .search-box:focus-within {
            border-color: rgba(74, 222, 128, 0.55);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5),
                        0 0 0 4px rgba(74, 222, 128, 0.12);
        }

        /* 搜索引擎下拉（带品牌图标） */
        .engine {
            position: relative;
            flex: none;
        }

        .engine-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 8px 14px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.4;
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .engine-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.16);
        }

        .engine-btn[aria-expanded="true"] {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(74, 222, 128, 0.45);
        }

        .engine-btn:focus-visible {
            outline: none;
            border-color: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
        }

        .engine-logo {
            display: grid;
            place-items: center;
            flex: none;
            width: 18px;
            height: 18px;
        }

        .engine-logo img,
        .engine-logo .brand-svg {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            object-fit: contain;
        }

        .engine-logo .brand-svg {
            display: block;
        }

        .engine-btn .logo-slot {
            display: none;
            place-items: center;
            width: 18px;
            height: 18px;
        }

        .engine[data-engine="bing"] .engine-btn .logo-slot[data-brand="bing"],
        .engine[data-engine="google"] .engine-btn .logo-slot[data-brand="google"],
        .engine[data-engine="baidu"] .engine-btn .logo-slot[data-brand="baidu"] {
            display: grid;
        }

        .engine .logo-fallback {
            display: grid;
            place-items: center;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .engine-caret {
            margin-left: 1px;
            color: var(--muted);
            transition: transform 0.2s ease;
        }

        .engine-btn[aria-expanded="true"] .engine-caret {
            transform: rotate(180deg);
        }

        .engine-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            z-index: 30;
            min-width: 180px;
            margin: 0;
            padding: 6px;
            list-style: none;
            background: #1C1C1E;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            transform-origin: top left;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .engine-menu.open {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .engine-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 10px;
            font-size: 14px;
            color: #D5D8DD;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .engine-item:hover,
        .engine-item:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
        }

        .engine-item[aria-selected="true"] {
            color: #FFFFFF;
        }

        .engine-item .check {
            margin-left: auto;
            color: #4ADE80;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .engine-item[aria-selected="true"] .check {
            opacity: 1;
        }

        .search-box input[type="text"] {
            flex: 1 1 auto;
            min-width: 0;
            width: auto;
            padding: 10px 8px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: transparent;
            border: none;
            outline: none;
            letter-spacing: 0.2px;
        }

        .search-box input[type="text"]::placeholder {
            color: #6B7076;
        }

        .search-box .search-btn {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            color: #062510;
            background: linear-gradient(135deg, #4ADE80, #22C55E 55%, #16A34A);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .search-box .search-btn svg {
            flex: none;
        }

        .search-box .search-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.07);
            box-shadow: 0 10px 22px rgba(34, 197, 94, 0.38);
        }

        .search-box .search-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .search-box .search-btn:focus-visible {
            outline: 2px solid rgba(74, 222, 128, 0.7);
            outline-offset: 3px;
        }

        /* ---------- 搜索历史 ---------- */
        .history-panel {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            z-index: 30;
            padding: 6px;
            background: #1C1C1E;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        }

        .history-panel[hidden] {
            display: none;
        }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px 6px;
        }

        .history-title {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--muted);
        }

        .history-clear {
            padding: 3px 8px;
            font-family: inherit;
            font-size: 12px;
            color: var(--muted);
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .history-clear:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.08);
        }

        .history-list {
            margin: 0;
            padding: 0;
            max-height: 304px;
            overflow-y: auto;
            list-style: none;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .history-item .h-text {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 14px;
            text-align: left;
            color: #D5D8DD;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover .h-text {
            color: #FFFFFF;
        }

        .history-item .h-time {
            flex: none;
            font-size: 11px;
            color: #6B7076;
            font-variant-numeric: tabular-nums;
        }

        .history-item .h-del {
            flex: none;
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            padding: 0;
            color: var(--muted);
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .history-item .h-del:hover {
            color: #F87171;
            background: rgba(248, 113, 113, 0.14);
        }

        .history-item .h-del svg {
            display: block;
        }

        /* ---------- 快捷方式 ---------- */
        .favorites {
            width: min(880px, calc(100% - 32px));
            margin: 28px auto 56px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 12px;
        }

        @media (min-width: 900px) {
            .favorites {
                grid-template-columns: repeat(8, minmax(0, 1fr));
            }
        }

        .favorite {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 8px 13px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)), #171717;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            color: var(--text);
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
            transition: transform 0.25s ease, border-color 0.25s ease,
                        box-shadow 0.25s ease, background 0.25s ease;
        }

        .favorite::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .favorite:hover {
            transform: translateY(-4px);
            border-color: rgba(74, 222, 128, 0.35);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.5),
                        inset 0 0 0 1px rgba(74, 222, 128, 0.08);
        }

        .favorite:hover::before {
            opacity: 1;
        }

        .favorite:active {
            transform: translateY(-1px) scale(0.98);
        }

        .favorite:focus-visible {
            outline: 2px solid rgba(74, 222, 128, 0.6);
            outline-offset: 3px;
        }

        .favorite .favicon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
        }

        .favorite:hover .favicon {
            transform: scale(1.07);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .favorite .favicon img {
            display: block;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: contain;
        }

        .favorite .favicon .fallback {
            font-size: 18px;
            font-weight: 700;
            color: #86EFAC;
        }

        .favorite .name {
            max-width: 100%;
            overflow: hidden;
            font-size: 13px;
            line-height: 1.2;
            color: #C9CDD3;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.25s ease;
        }

        .favorite:hover .name {
            color: #FFFFFF;
        }

        /* 响应式调整 */
        @media (max-width: 820px) {
            .brand-name {
                display: none;
            }
        }

        @media (max-width: 600px) {

    <script>
        const weatherApiKey = '1232359e6521258a7d8db22030f17db8'; // 请替换成你的 OpenWeatherMap API 密钥
        const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=Beijing&appid=${weatherApiKey}&units=metric&lang=zh_cn`;

        const dateEl = document.getElementById('date');
        const dateLink = document.getElementById('date-link');
        const weatherEl = document.getElementById('weather');
        const weatherLink = document.getElementById('weather-link');

        const WEEK_DAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

        // 渲染日期：大号"日" + 年月 + 星期标签
        function renderDate() {
            const now = new Date();
            dateEl.innerHTML = `
                <span class="day">${now.getDate()}</span>
                <span class="date-meta">
                    <span class="ym">${now.getFullYear()}年${now.getMonth() + 1}月</span>
                    <span class="week">${WEEK_DAYS[now.getDay()]}</span>
                </span>`;
        }

        renderDate();
        // 页面跨天时自动更新日期
        setInterval(renderDate, 60 * 1000);

        // 点击日期跳转到 Bing 搜索“日期”
        function openDateSearch() {
            window.open('https://cn.bing.com/search?q=%E6%97%A5%E6%9C%9F', '_blank');
        }

        dateLink.addEventListener('click', openDateSearch);
        dateLink.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openDateSearch();
            }
        });

        // 根据天气代码选择图标
        function weatherIcon(id) {
            if (id >= 200 && id < 300) return '⛈️';
            if (id >= 300 && id < 400) return '🌦️';
            if (id >= 500 && id < 600) return id < 502 ? '🌦️' : '🌧️';
            if (id >= 600 && id < 700) return '❄️';
            if (id >= 700 && id < 800) return '🌫️';
            if (id === 800) return '☀️';
            if (id === 801 || id === 802) return '⛅';
            if (id === 803 || id === 804) return '☁️';
            return '🌡️';
        }

        // 获取天气信息
        fetch(weatherUrl)
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(data => {
                const temp = Math.round(data.main.temp);
                const tempMin = Math.round(data.main.temp_min);
                const tempMax = Math.round(data.main.temp_max);
                const weatherDescription = data.weather[0].description;
                const icon = weatherIcon(data.weather[0].id);

                weatherEl.classList.remove('loading');
                weatherEl.innerHTML = `
                    <span class="weather-icon">${icon}</span>
                    <span class="weather-info">
                        <span class="temp">${temp}°<span class="unit">C</span></span>
                        <span class="desc">${weatherDescription} · <span class="min">${tempMin}°</span> / <span class="max">${tempMax}°</span></span>
                    </span>`;
            })
            .catch(() => {
                weatherEl.classList.remove('loading');
                weatherEl.innerHTML = `
                    <span class="weather-icon">🌐</span>
                    <span class="weather-info">
                        <span class="temp">--°</span>
                        <span class="desc">天气获取失败，点击查看</span>
                    </span>`;
            });

        // 点击整条组件打开北京天气
        function openWeather() {
            window.open('https://www.baidu.com/s?wd=%E5%8C%97%E4%BA%AC%E5%A4%A9%E6%B0%94', '_blank');
        }

        weatherLink.addEventListener('click', openWeather);
        weatherLink.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openWeather();
            }
        });

        // 搜索功能
        const searchInput = document.getElementById('search-query');

        function search() {
            const engine = document.getElementById('search-engine').value;
            const query = searchInput.value.trim();

            if (!query) {
                searchInput.focus();
                return;
            }

            window.open(engine + encodeURIComponent(query), '_blank');
            addHistory(query);
        }

        // 回车即搜索
        searchInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                event.preventDefault();
                search();
            } else if (event.key === 'Escape') {
                hideHistory();
            }
        });

        // ---------- 搜索历史（localStorage） ----------
        const HISTORY_KEY = 'cuiwei_search_history';
        const HISTORY_MAX = 20;
        const searchWrap = document.querySelector('.search-wrap');
        const historyPanel = document.getElementById('history-panel');
        const historyList = document.getElementById('history-list');
        const historyClear = document.getElementById('history-clear');

        function loadHistory() {
            try {
                const list = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                return Array.isArray(list)
                    ? list.filter(item => item && typeof item.q === 'string' && item.q.trim())
                    : [];
            } catch {
                return [];
            }
        }

        function saveHistory(list) {
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
            } catch {
                /* 存储不可用时静默失败 */
            }
        }

        // 记录一次搜索：去重后置顶，最多保留 HISTORY_MAX 条
        function addHistory(query) {
            const list = loadHistory().filter(item => item.q !== query);
            list.unshift({ q: query, t: Date.now() });
            saveHistory(list.slice(0, HISTORY_MAX));
            renderHistory();
        }

        function removeHistory(index) {
            const list = loadHistory();
            list.splice(index, 1);
            saveHistory(list);
            renderHistory();
        }

        function clearHistory() {
            saveHistory([]);
            hideHistory();
        }

        function formatTime(ts) {
            const d = new Date(ts);
            const now = new Date();
            const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);

            if (d.toDateString() === now.toDateString()) return `今天 ${hm}`;
            if (d.toDateString() === yesterday.toDateString()) return `昨天 ${hm}`;
            return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
        }

        function renderHistory() {
            const list = loadHistory();
            historyList.innerHTML = '';

            if (!list.length) {
                hideHistory();
                return;
            }

            list.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';

                const text = document.createElement('span');
                text.className = 'h-text';
                text.textContent = item.q;

                const time = document.createElement('span');
                time.className = 'h-time';
                time.textContent = formatTime(item.t);

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'h-del';
                del.title = '删除此条记录';
                del.setAttribute('aria-label', '删除此条记录：' + item.q);
                del.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>`;
                del.addEventListener('click', event => {
                    event.stopPropagation();
                    removeHistory(index);
                });

                // 点击某条历史直接重新搜索
                li.addEventListener('click', () => {
                    searchInput.value = item.q;
                    search();
                    hideHistory();
                });

                li.append(text, time, del);
                historyList.appendChild(li);
            });
        }

        function showHistory() {
            renderHistory();
            historyPanel.hidden = !loadHistory().length;
        }

        function hideHistory() {
            historyPanel.hidden = true;
        }

        searchInput.addEventListener('focus', showHistory);
        searchInput.addEventListener('click', showHistory);
        historyClear.addEventListener('click', clearHistory);

        // 搜索引擎下拉（图标 + 键盘操作）
        const engineBox = document.getElementById('engine');
        const engineBtn = document.getElementById('engine-btn');
        const engineMenu = document.getElementById('engine-menu');
        const engineName = document.getElementById('engine-name');
        const engineInput = document.getElementById('search-engine');
        const engineItems = Array.from(engineMenu.querySelectorAll('.engine-item'));

        function setEngineMenu(open) {
            engineMenu.classList.toggle('open', open);
            engineMenu.setAttribute('aria-hidden', open ? 'false' : 'true');
            engineBtn.setAttribute('aria-expanded', open ? 'true' : 'false');

            if (open) {
                const current = engineItems.find(item => item.getAttribute('aria-selected') === 'true') || engineItems[0];
                current.focus();
            }
        }

        function selectEngine(item) {
            engineBox.dataset.engine = item.dataset.brand;
            engineName.textContent = item.dataset.name;
            engineInput.value = item.dataset.value;
            engineBtn.setAttribute('aria-label', '搜索引擎：' + item.dataset.name);

            engineItems.forEach(el => el.setAttribute('aria-selected', el === item ? 'true' : 'false'));

            setEngineMenu(false);
            engineBtn.focus();
        }

        engineBtn.addEventListener('click', () => {
            setEngineMenu(engineBtn.getAttribute('aria-expanded') !== 'true');
        });

        engineBtn.addEventListener('keydown', event => {
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                event.preventDefault();
                setEngineMenu(true);
            } else if (event.key === 'Escape') {
                setEngineMenu(false);
            }
        });

        engineItems.forEach((item, index) => {
            item.addEventListener('click', () => selectEngine(item));

            item.addEventListener('keydown', event => {
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    event.preventDefault();
                    const step = event.key === 'ArrowDown' ? 1 : -1;
                    engineItems[(index + step + engineItems.length) % engineItems.length].focus();
                } else if (event.key === 'Home') {
                    event.preventDefault();
                    engineItems[0].focus();
                } else if (event.key === 'End') {
                    event.preventDefault();
                    engineItems[engineItems.length - 1].focus();
                } else if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    selectEngine(item);
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    setEngineMenu(false);
                    engineBtn.focus();
                } else if (event.key === 'Tab') {
                    setEngineMenu(false);
                }
            });
        });

        // 点击空白处关闭下拉与历史面板
        document.addEventListener('click', event => {
            if (!engineBox.contains(event.target)) setEngineMenu(false);
            if (!searchWrap.contains(event.target)) hideHistory();
        });

        // 搜索引擎图标加载失败时用品牌首字占位
        document.querySelectorAll('.engine-logo img').forEach(img => {
            img.addEventListener('error', () => {
                const box = img.parentElement;
                if (!box || box.dataset.fallback) return;
                box.dataset.fallback = '1';

                const fallback = document.createElement('span');
                fallback.className = 'logo-fallback';
                fallback.textContent = (img.alt || '?').charAt(0);
                fallback.style.background = img.dataset.color || '#3A3A3C';
                img.replaceWith(fallback);
            });
        });

        // 图标加载失败时用名称首字占位，避免出现空白方块
        document.querySelectorAll('.favorite .favicon img').forEach(img => {
            const showFallback = () => {
                if (img.dataset.done) return;
                img.dataset.done = '1';

                const box = img.parentElement;
                const nameEl = img.closest('.favorite').querySelector('.name');
                img.remove();

                const fallback = document.createElement('span');
                fallback.className = 'fallback';
                fallback.textContent = nameEl ? nameEl.textContent.trim().charAt(0) : '?';
                box.appendChild(fallback);
            };

            img.addEventListener('error', showFallback);
            if (img.complete && img.naturalWidth === 0) showFallback();
        });
    </script>
</body>
</html>
